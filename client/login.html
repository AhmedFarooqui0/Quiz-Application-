<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In — DevQuiz</title>
  <meta name="description" content="Log in to your DevQuiz account." />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/quiz.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💻</text></svg>" />
</head>
<body>
  <div class="bg-gradient-mesh"></div>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo">
        <div class="logo-icon">💻</div>
        Dev<span>Quiz</span>
      </a>
      <div class="nav-right">
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="leaderboard.html">Leaderboard</a></li>
      </ul>
      <div id="nav-auth-slot"></div>
      </div>
    </div>
  </nav>

  <div class="auth-page">
    <div class="auth-card animate-fade-up">
      <div class="auth-header">
        <div class="auth-icon">🔐</div>
        <div class="auth-title">Welcome back</div>
        <div class="auth-subtitle">Log in to continue your quiz streak.</div>
      </div>

      <div class="auth-alert" id="auth-alert"></div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="email-input">Email</label>
          <input type="email" id="email-input" class="form-input" placeholder="you@example.com" autocomplete="email" />
          <div class="auth-field-error" id="email-error"></div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password-input">Password</label>
          <div class="password-wrapper">
            <input type="password" id="password-input" class="form-input" placeholder="Your password" autocomplete="current-password" />
            <button type="button" class="password-toggle" id="toggle-password">Show</button>
          </div>
          <div class="auth-field-error" id="password-error"></div>
        </div>

        <button type="submit" class="btn btn-primary auth-submit-btn" id="login-btn">Log In</button>
      </form>

      <div class="auth-footer" id="resend-wrapper" style="display:none;">
        Didn't get the email? <a href="#" id="resend-link">Resend verification link</a>
      </div>

      <div class="auth-footer">
        Don't have an account? <a href="signup.html">Sign up</a>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
